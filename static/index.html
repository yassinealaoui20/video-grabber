<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Video Grabber</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f7;--ink:#14213d;--card:#fff;--accent:#2563eb;--mute:#5b6678;--err:#b42318}
@media(prefers-color-scheme:dark){:root{--bg:#0e1626;--ink:#e8edf6;--card:#16213a;--accent:#6ea0ff;--mute:#9aa6bd;--err:#ff8b7e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 Figtree,system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}
main{width:100%;max-width:640px}
h1{font:800 clamp(2.2rem,7vw,3.4rem)/1.05 "Bricolage Grotesque",sans-serif;margin:0 0 8px}
p.sub{color:var(--mute);margin:0 0 28px}
.row{display:flex;gap:10px;flex-wrap:wrap}
input{flex:1 1 280px;padding:15px 16px;font:inherit;border:2px solid transparent;border-radius:12px;background:var(--card);color:var(--ink)}
input:focus,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{padding:15px 24px;font:600 1rem Figtree,sans-serif;border:0;border-radius:12px;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#out{margin-top:24px}
.card{display:flex;gap:16px;background:var(--card);padding:14px;border-radius:14px;align-items:center}
.card img{width:140px;border-radius:8px;flex:none}
.card h2{font:600 1.05rem/1.3 Figtree;margin:0 0 4px}
.card small{color:var(--mute)}
.card a{display:inline-block;margin-top:10px;padding:10px 18px;background:var(--accent);color:#fff;border-radius:10px;text-decoration:none;font-weight:600}
.err{color:var(--err);font-weight:600}
.note{margin-top:32px;font-size:.85rem;color:var(--mute)}
@media(max-width:480px){.card{flex-direction:column;align-items:flex-start}.card img{width:100%}}
</style></head><body><main>
<h1>Paste a link. Get the MP4.</h1>
<p class="sub">Works with YouTube, Facebook, Instagram and TikTok.</p>
<div class="row">
<input id="url" type="url" placeholder="https://www.tiktok.com/@user/video/..." aria-label="Video link">
<button id="go">Find video</button></div>
<div id="out" aria-live="polite"></div>
<p class="note">Only download videos you own or have permission to use. Respect each platform's terms and copyright law.</p>
</main>
<script>
const $=id=>document.getElementById(id);
const fmt=s=>s?Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0"):"";
async function find(){
  const url=$("url").value.trim(), out=$("out"), b=$("go");
  if(!url){out.innerHTML='<p class="err">Paste a video link first.</p>';return}
  b.disabled=true;b.textContent="Searching...";out.textContent="";
  try{
    const r=await fetch("/api/info",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url})});
    const d=await r.json();
    if(!r.ok) throw new Error(d.error);
    const esc=t=>String(t||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
    out.innerHTML=`<div class="card">${d.thumbnail?`<img src="${esc(d.thumbnail)}" alt="">`:""}
      <div><h2>${esc(d.title)}</h2><small>${esc(d.uploader)} ${fmt(d.duration)}</small><br>
      <a href="/api/download?url=${encodeURIComponent(url)}">Download MP4</a></div></div>`;
  }catch(e){out.innerHTML=`<p class="err">${e.message||"Something went wrong."}</p>`}
  b.disabled=false;b.textContent="Find video";
}
$("go").onclick=find;
$("url").addEventListener("keydown",e=>e.key==="Enter"&&find());
</script></body></html>
